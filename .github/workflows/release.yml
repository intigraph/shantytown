name: Release

# Release Please opens reviewed version PRs on main. After their green merge,
# it creates a draft/tag; this SAME RUN keeps publication behind all gates.
# Bot pull-request runs may require the existing scheduled approval lane.
# Manual v* tags retain
# the same test, metadata, built-wheel and checksum publication path.

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write        # required to create the release

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: >-
      ${{ always() && !cancelled() &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (needs.release-please.result == 'success' &&
            needs.release-please.outputs.releases_created == 'true')) }}
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.release-please.outputs.tag_name }}
    # Keep this aligned with the labels advertised by the fleet runner.  There
    # is no GitHub-hosted ubuntu-latest runner on the self-hosted Forgejo lane.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history: release notes are generated from it
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build

      # THE GATE. Publishing over a red suite is how a broken harness reaches
      # every consumer with a version number that implies somebody checked.
      - name: Test
        run: python -m pytest -q

      # A tag that disagrees with the declared version produces an artifact
      # whose own `--version` contradicts the release it ships under — the same
      # two-worlds failure the CI drift check exists to prevent, one layer up.
      # Cheap to assert, and the only moment it can be caught.
      - name: Tag matches the declared version
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tomllib
          tag = os.environ["RELEASE_TAG"]          # e.g. v0.1.0
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{declared}":
              sys.exit(
                  f"tag/version mismatch: tag is {tag!r} but pyproject.toml "
                  f"declares {declared!r} (expected tag 'v{declared}'). "
                  f"Bump the version, or tag the version that is declared."
              )
          tagged = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tagged != os.environ["GITHUB_SHA"]:
              sys.exit("release tag differs from the triggering commit")
          print(f"tag {tag} matches declared version {declared} and triggering SHA")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate and verify release checksums
        run: |
          python scripts/release-checksums.py dist
          (cd dist && sha256sum -c SHA256SUMS)

      # The entry point, exercised from the BUILT wheel rather than the source
      # tree — the tests import modules directly, so they all pass over an
      # install whose console script is broken.
      #
      # EXPECT `st <version> (unknown)` HERE, and do not "fix" it. `deployed_sha`
      # answers from the package directory's git HEAD, and a wheel install is not
      # a checkout, so there is no sha to report. That is the right answer for
      # this install mode: for a wheel the VERSION is the identity — immutable
      # and tied to this tag — whereas for the editable checkout the crews run,
      # the SHA is the identity because the version is a static constant. Two
      # install modes, two identity mechanisms, each using the one that can
      # actually distinguish builds.
      - name: Installed console script runs
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          /tmp/relcheck/bin/st --version

      - name: Recheck artifacts before publication
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Existing releases on the automated path must still be drafts.
          # An API failure is UNKNOWN and stops; it never means absent.
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            [[ "$draft" == true ]] || { echo "Expected an unpublished draft" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes dist/*
          fi
