name: Installer controls
on:
  pull_request:
  push:
    branches: [main]
# Superseded PR heads may stop; each main push keeps its own verdict.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standalone entrypoint and refusal controls
        run: |
          sh -n install.sh
          python3 scripts/test-install-release.py
