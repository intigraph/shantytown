<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="How a work item moves through a crew. Five stages run left to right. Ask: you, a schedule or an event creates a work item with st task. Dispatch: the administrator sends it with st go, and it is admitted only if the agent is free and the account has room. Work: the worker reads who it is and what it owns with st anchor, then works in its own pane. Stop: one verdict decides whether the worker takes its next item, reports to its lead or rests; taking the next item loops back to Work. Deliver: st repo pr opens a pull request, a short-lived reviewer agent reviews it, and the item is closed. Under each stage is the part of the Quipu stack that serves it. Chaski and Shuttle trigger an item. Seeds and Quipu say who owns what. Bobbin and Yupana inform and constrain the work. Camayoc and Desire Path account for it and learn from it. Quipu remembers the outcome. Between turns a host timer runs st fleet tend. Every stack tool is optional.">
  <style>
    .t{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
    .m{font-family:JetBrains Mono,Menlo,Consolas,monospace}
    .card{fill:#20203a;stroke:#2e2e4d}
    .pipe{stroke:#ff8a70;stroke-width:2.5;fill:none;stroke-dasharray:6 6;opacity:.75;animation:flow 1.2s linear infinite}
    .up{stroke:#ffc24d;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite}
    .down{stroke:#ff4fa0;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite reverse}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion: reduce){.pipe,.up,.down{animation:none}}
  </style>
  <rect width="960" height="640" rx="20" fill="#12121f"/>
  <text class="t" x="40" y="52" fill="#ecebf5" font-size="24" font-weight="700">How a work item moves through a crew</text>
  <text class="t" x="40" y="78" fill="#a7a6c2" font-size="14">Shantytown moves the item. The Quipu stack tells each agent what it owns, what to read and what it may change.</text>
  <rect x="30" y="128" width="164" height="158" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="44" y="152" fill="#ffc24d" font-size="9.5" font-weight="700" letter-spacing="0.8">YOU OR A TRIGGER</text>
  <text class="t" x="44" y="180" fill="#ecebf5" font-size="19" font-weight="700">Ask</text>
  <text class="m" x="44" y="203" fill="#ff4fa0" font-size="12.5">st task</text>
  <text class="t" x="44" y="226.0" fill="#a7a6c2" font-size="12.5">A work item with an</text>
  <text class="t" x="44" y="243.2" fill="#a7a6c2" font-size="12.5">owner, a priority</text>
  <text class="t" x="44" y="260.4" fill="#a7a6c2" font-size="12.5">and a due date.</text>
  <rect x="214" y="128" width="164" height="158" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="228" y="152" fill="#ffc24d" font-size="9.5" font-weight="700" letter-spacing="0.8">ADMINISTRATOR</text>
  <text class="t" x="228" y="180" fill="#ecebf5" font-size="19" font-weight="700">Dispatch</text>
  <text class="m" x="228" y="203" fill="#ff4fa0" font-size="12.5">st go ITEM AGENT</text>
  <text class="t" x="228" y="226.0" fill="#a7a6c2" font-size="12.5">Admitted only if the</text>
  <text class="t" x="228" y="243.2" fill="#a7a6c2" font-size="12.5">agent is free and</text>
  <text class="t" x="228" y="260.4" fill="#a7a6c2" font-size="12.5">its account has</text>
  <text class="t" x="228" y="277.6" fill="#a7a6c2" font-size="12.5">room.</text>
  <rect x="398" y="128" width="164" height="158" rx="14" fill="#20203a" stroke="#ff4fa0" stroke-width="1.6"/>
  <text class="t" x="412" y="152" fill="#ffc24d" font-size="9.5" font-weight="700" letter-spacing="0.8">WORKER</text>
  <text class="t" x="412" y="180" fill="#ecebf5" font-size="19" font-weight="700">Work</text>
  <text class="m" x="412" y="203" fill="#ff4fa0" font-size="12.5">st anchor</text>
  <text class="t" x="412" y="226.0" fill="#a7a6c2" font-size="12.5">Reads who it is and</text>
  <text class="t" x="412" y="243.2" fill="#a7a6c2" font-size="12.5">what it owns, then</text>
  <text class="t" x="412" y="260.4" fill="#a7a6c2" font-size="12.5">works in its own</text>
  <text class="t" x="412" y="277.6" fill="#a7a6c2" font-size="12.5">pane.</text>
  <rect x="582" y="128" width="164" height="158" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="596" y="152" fill="#ffc24d" font-size="9.5" font-weight="700" letter-spacing="0.8">WORKER</text>
  <text class="t" x="596" y="180" fill="#ecebf5" font-size="19" font-weight="700">Stop</text>
  <text class="m" x="596" y="203" fill="#ff4fa0" font-size="12.5">stop hook</text>
  <text class="t" x="596" y="226.0" fill="#a7a6c2" font-size="12.5">One verdict: take</text>
  <text class="t" x="596" y="243.2" fill="#a7a6c2" font-size="12.5">the next item,</text>
  <text class="t" x="596" y="260.4" fill="#a7a6c2" font-size="12.5">report to the lead,</text>
  <text class="t" x="596" y="277.6" fill="#a7a6c2" font-size="12.5">or rest.</text>
  <rect x="766" y="128" width="164" height="158" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="780" y="152" fill="#ffc24d" font-size="9.5" font-weight="700" letter-spacing="0.8">WORKER AND REVIEWER</text>
  <text class="t" x="780" y="180" fill="#ecebf5" font-size="19" font-weight="700">Deliver</text>
  <text class="m" x="780" y="203" fill="#ff4fa0" font-size="12.5">st repo pr</text>
  <text class="t" x="780" y="226.0" fill="#a7a6c2" font-size="12.5">A short-lived agent</text>
  <text class="t" x="780" y="243.2" fill="#a7a6c2" font-size="12.5">can review. The</text>
  <text class="t" x="780" y="260.4" fill="#a7a6c2" font-size="12.5">change merges and</text>
  <text class="t" x="780" y="277.6" fill="#a7a6c2" font-size="12.5">the item closes.</text>
  <path class="pipe" d="M196 174 H206"/>
  <polygon points="213,174 204,169 204,179" fill="#ff8a70"/>
  <path class="pipe" d="M380 174 H390"/>
  <polygon points="397,174 388,169 388,179" fill="#ff8a70"/>
  <path class="pipe" d="M564 174 H574"/>
  <polygon points="581,174 572,169 572,179" fill="#ff8a70"/>
  <path class="pipe" d="M748 174 H758"/>
  <polygon points="765,174 756,169 756,179" fill="#ff8a70"/>
  <path class="pipe" d="M664.0 126 C664.0 98 480.0 98 480.0 116"/>
  <polygon points="480.0,125 475.0,116 485.0,116" fill="#ff8a70"/>
  <text class="t" x="572.0" y="98" fill="#ff8a70" font-size="12" text-anchor="middle">next item on its plate</text>
  <path class="up" d="M64 364 V298"/>
  <polygon points="64,290 59,299 69,299" fill="#ffc24d"/>
  <text class="t" x="76" y="331.0" fill="#ffc24d" font-size="12.5" font-weight="600">trigger</text>
  <rect x="30" y="368" width="164" height="132" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="44" y="396" fill="#ffc24d" font-size="13" font-weight="700">Chaski · Shuttle</text>
  <text class="t" x="44" y="420.0" fill="#a7a6c2" font-size="12.5">An event or a signed</text>
  <text class="t" x="44" y="437.2" fill="#a7a6c2" font-size="12.5">workflow can open</text>
  <text class="t" x="44" y="454.4" fill="#a7a6c2" font-size="12.5">the item.</text>
  <path class="up" d="M248 364 V298"/>
  <polygon points="248,290 243,299 253,299" fill="#ffc24d"/>
  <text class="t" x="260" y="331.0" fill="#ffc24d" font-size="12.5" font-weight="600">who owns what</text>
  <rect x="214" y="368" width="164" height="132" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="228" y="396" fill="#ffc24d" font-size="13" font-weight="700">Seeds · Quipu</text>
  <text class="t" x="228" y="420.0" fill="#a7a6c2" font-size="12.5">The item, its owner</text>
  <text class="t" x="228" y="437.2" fill="#a7a6c2" font-size="12.5">and due date. The</text>
  <text class="t" x="228" y="454.4" fill="#a7a6c2" font-size="12.5">crew and who leads</text>
  <text class="t" x="228" y="471.6" fill="#a7a6c2" font-size="12.5">whom.</text>
  <path class="up" d="M432 364 V298"/>
  <polygon points="432,290 427,299 437,299" fill="#ffc24d"/>
  <text class="t" x="444" y="331.0" fill="#ffc24d" font-size="12.5" font-weight="600">inform, constrain</text>
  <rect x="398" y="368" width="164" height="132" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="412" y="396" fill="#ffc24d" font-size="13" font-weight="700">Bobbin · Yupana</text>
  <text class="t" x="412" y="420.0" fill="#a7a6c2" font-size="12.5">The code this item</text>
  <text class="t" x="412" y="437.2" fill="#a7a6c2" font-size="12.5">touches. The impact</text>
  <text class="t" x="412" y="454.4" fill="#a7a6c2" font-size="12.5">of each edit, and</text>
  <text class="t" x="412" y="471.6" fill="#a7a6c2" font-size="12.5">your policies.</text>
  <path class="down" d="M616 290 V356"/>
  <polygon points="616,364 611,355 621,355" fill="#ff4fa0"/>
  <text class="t" x="628" y="331.0" fill="#ff4fa0" font-size="12.5" font-weight="600">account, learn</text>
  <rect x="582" y="368" width="164" height="132" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="596" y="396" fill="#ffc24d" font-size="13" font-weight="700">Camayoc · Desire Path</text>
  <text class="t" x="596" y="420.0" fill="#a7a6c2" font-size="12.5">Tokens spent on the</text>
  <text class="t" x="596" y="437.2" fill="#a7a6c2" font-size="12.5">item. Tool calls</text>
  <text class="t" x="596" y="454.4" fill="#a7a6c2" font-size="12.5">that failed.</text>
  <path class="down" d="M800 290 V356"/>
  <polygon points="800,364 795,355 805,355" fill="#ff4fa0"/>
  <text class="t" x="812" y="331.0" fill="#ff4fa0" font-size="12.5" font-weight="600">remember</text>
  <rect x="766" y="368" width="164" height="132" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="780" y="396" fill="#ffc24d" font-size="13" font-weight="700">Quipu</text>
  <text class="t" x="780" y="420.0" fill="#a7a6c2" font-size="12.5">Rulings and handoffs</text>
  <text class="t" x="780" y="437.2" fill="#a7a6c2" font-size="12.5">on the item, for the</text>
  <text class="t" x="780" y="454.4" fill="#a7a6c2" font-size="12.5">next session to</text>
  <text class="t" x="780" y="471.6" fill="#a7a6c2" font-size="12.5">query.</text>
  <rect x="30" y="522" width="440" height="92" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="48" y="550" fill="#ecebf5" font-size="15" font-weight="700">Between turns</text>
  <text class="m" x="160" y="550" fill="#ff4fa0" font-size="12.5">st fleet tend</text>
  <text class="t" x="48" y="572.0" fill="#a7a6c2" font-size="12.5">A host timer runs it every few minutes. It restarts an agent</text>
  <text class="t" x="48" y="589.2" fill="#a7a6c2" font-size="12.5">that died, enforces deadlines and feeds an idle agent its</text>
  <text class="t" x="48" y="606.4" fill="#a7a6c2" font-size="12.5">next item.</text>
  <rect x="490" y="522" width="440" height="92" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="508" y="550" fill="#ecebf5" font-size="15" font-weight="700">The Quipu stack is optional</text>
  <text class="t" x="508" y="572.0" fill="#a7a6c2" font-size="12.5">With no stack tool installed, the same stages run on local</text>
  <text class="t" x="508" y="589.2" fill="#a7a6c2" font-size="12.5">files. Gold arrows guide the agent. Pink arrows record what</text>
  <text class="t" x="508" y="606.4" fill="#a7a6c2" font-size="12.5">it did.</text>
</svg>
