<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="One crew on two hosts. Each host has its own store, its own panes and its own timer running st fleet tend, and launches only the agents placed on it. The two hosts declare each other as peers in shantytown.toml and reach each other over SSH. A command for an agent on the other host, such as st go, st inbox or the st crew census, runs that host&#x27;s own st over the SSH link. Both hosts read the same Quipu registry, which holds the members and the host each runs on, and the same board of work items. st ops doctor --deploy and st ops doctor --relay check the setup from both directions.">
  <style>
    .t{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
    .m{font-family:JetBrains Mono,Menlo,Consolas,monospace}
    .card{fill:#20203a;stroke:#2e2e4d}
    .pipe{stroke:#ff8a70;stroke-width:2.5;fill:none;stroke-dasharray:6 6;opacity:.75;animation:flow 1.2s linear infinite}
    .up{stroke:#ffc24d;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite}
    .down{stroke:#ff4fa0;stroke-width:2;fill:none;stroke-dasharray:4 5;opacity:.8;animation:flow 1.6s linear infinite reverse}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion: reduce){.pipe,.up,.down{animation:none}}
  </style>
  <rect width="960" height="600" rx="20" fill="#12121f"/>
  <text class="t" x="40" y="52" fill="#ecebf5" font-size="24" font-weight="700">One crew on two hosts</text>
  <text class="t" x="40" y="78" fill="#a7a6c2" font-size="14">Each host runs only its own agents. A command for an agent on the other host runs that host&#x27;s own st, over SSH.</text>
  <rect x="190" y="100" width="580" height="112" rx="16" fill="none" stroke="#ffc24d" stroke-width="1.2" stroke-dasharray="5 6"/>
  <text class="t" x="480" y="122" fill="#ffc24d" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">SHARED BY BOTH HOSTS</text>
  <rect x="206" y="132" width="266" height="68" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="222" y="158" fill="#ffc24d" font-size="15" font-weight="700">Quipu registry</text>
  <text class="t" x="222" y="180" fill="#a7a6c2" font-size="12">Members, and the host each runs on.</text>
  <rect x="488" y="132" width="266" height="68" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="504" y="158" fill="#ffc24d" font-size="15" font-weight="700">One board</text>
  <text class="t" x="504" y="180" fill="#a7a6c2" font-size="12">One tracker, so an item has one owner.</text>
  <rect x="30" y="252" width="330" height="250" rx="14" fill="#20203a" stroke="#ff4fa0" stroke-width="1.4"/>
  <text class="t" x="48" y="280" fill="#ff4fa0" font-size="9.5" font-weight="700" letter-spacing="0.8">HOST</text>
  <text class="m" x="90" y="281" fill="#ecebf5" font-size="13">first</text>
  <rect x="48" y="296" width="140" height="84" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="60" y="320" fill="#ecebf5" font-size="14" font-weight="700">Store</text>
  <text class="t" x="60" y="340.0" fill="#a7a6c2" font-size="11.5">Cards, settings and</text>
  <text class="t" x="60" y="355.9" fill="#a7a6c2" font-size="11.5">its own</text>
  <text class="t" x="60" y="371.8" fill="#a7a6c2" font-size="11.5">shantytown.toml</text>
  <rect x="202" y="296" width="140" height="84" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="214" y="320" fill="#ecebf5" font-size="14" font-weight="700">Panes</text>
  <text class="m" x="214" y="340" fill="#a7a6c2" font-size="11.5">st-admin</text>
  <text class="m" x="214" y="356" fill="#a7a6c2" font-size="11.5">st-worker-a</text>
  <rect x="48" y="394" width="294" height="92" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="60" y="418" fill="#ecebf5" font-size="14" font-weight="700">Timer</text>
  <text class="m" x="114" y="418" fill="#ff4fa0" font-size="12">st fleet tend</text>
  <text class="t" x="60" y="440.0" fill="#a7a6c2" font-size="11.5">Supervises the agents placed on this host</text>
  <text class="t" x="60" y="455.9" fill="#a7a6c2" font-size="11.5">and skips the rest.</text>
  <rect x="600" y="252" width="330" height="250" rx="14" fill="#20203a" stroke="#ff4fa0" stroke-width="1.4"/>
  <text class="t" x="618" y="280" fill="#ff4fa0" font-size="9.5" font-weight="700" letter-spacing="0.8">HOST</text>
  <text class="m" x="660" y="281" fill="#ecebf5" font-size="13">second</text>
  <rect x="618" y="296" width="140" height="84" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="630" y="320" fill="#ecebf5" font-size="14" font-weight="700">Store</text>
  <text class="t" x="630" y="340.0" fill="#a7a6c2" font-size="11.5">Cards, settings and</text>
  <text class="t" x="630" y="355.9" fill="#a7a6c2" font-size="11.5">its own</text>
  <text class="t" x="630" y="371.8" fill="#a7a6c2" font-size="11.5">shantytown.toml</text>
  <rect x="772" y="296" width="140" height="84" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="784" y="320" fill="#ecebf5" font-size="14" font-weight="700">Panes</text>
  <text class="m" x="784" y="340" fill="#a7a6c2" font-size="11.5">st-second-admin</text>
  <text class="m" x="784" y="356" fill="#a7a6c2" font-size="11.5">st-worker-b</text>
  <rect x="618" y="394" width="294" height="92" rx="14" fill="#1a1a2e" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="630" y="418" fill="#ecebf5" font-size="14" font-weight="700">Timer</text>
  <text class="m" x="684" y="418" fill="#ff4fa0" font-size="12">st fleet tend</text>
  <text class="t" x="630" y="440.0" fill="#a7a6c2" font-size="11.5">Admits a launch against the other host&#x27;s</text>
  <text class="t" x="630" y="455.9" fill="#a7a6c2" font-size="11.5">last census when it is down.</text>
  <path class="up" d="M150 248 V160 H178"/>
  <polygon points="187,160 178,155 178,165" fill="#ffc24d"/>
  <path class="up" d="M810 248 V160 H782"/>
  <polygon points="773,160 782,155 782,165" fill="#ffc24d"/>
  <text class="t" x="140" y="150" fill="#ffc24d" font-size="12" text-anchor="end">reads, writes</text>
  <text class="t" x="820" y="150" fill="#ffc24d" font-size="12">reads, writes</text>
  <path class="pipe" d="M372 350 H588"/>
  <polygon points="596,350 587,345 587,355" fill="#ff8a70"/>
  <path class="pipe" d="M588 392 H372"/>
  <polygon points="364,392 373,387 373,397" fill="#ff8a70"/>
  <text class="t" x="480" y="318" fill="#ecebf5" font-size="16" font-weight="700" text-anchor="middle">SSH</text>
  <text class="m" x="480" y="338" fill="#ff4fa0" font-size="11.5" text-anchor="middle">[host.peers.second]</text>
  <text class="m" x="480" y="380" fill="#ff4fa0" font-size="11.5" text-anchor="middle">[host.peers.first]</text>
  <text class="t" x="480" y="424.0" fill="#a7a6c2" font-size="12" text-anchor="middle">st go, st inbox and the st</text>
  <text class="t" x="480" y="440.6" fill="#a7a6c2" font-size="12" text-anchor="middle">crew census cross here</text>
  <rect x="30" y="522" width="900" height="56" rx="14" fill="#20203a" stroke="#2e2e4d" stroke-width="1.2"/>
  <text class="t" x="48" y="546" fill="#ecebf5" font-size="14" font-weight="700">Prove it from both hosts</text>
  <text class="m" x="230" y="546" fill="#ff4fa0" font-size="12">st ops doctor --deploy</text>
  <text class="m" x="410" y="546" fill="#ff4fa0" font-size="12">st ops doctor --relay</text>
  <text class="m" x="584" y="546" fill="#ff4fa0" font-size="12">st fleet roles sync --require-host-sync 1</text>
  <text class="t" x="48" y="566" fill="#a7a6c2" font-size="12">An unreachable host is reported as unknown, never as an empty crew.</text>
</svg>
